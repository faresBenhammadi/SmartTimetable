  <circle cx="24" cy="30" r="2.5" fill="#ffffff" opacity="0.9" />
  <circle cx="34" cy="30" r="2.5" fill="#ffffff" opacity="0.9" />
  <circle cx="14" cy="38" r="2.5" fill="#ffffff" opacity="0.5" />
