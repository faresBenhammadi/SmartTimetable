<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accès Sécurisé — Emploi du Temps Scolaire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <span class="login-logo">📅</span>
        <h2>Emploi du Temps</h2>
        <p>Planificateur Scolaire</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages">
          {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
        {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('login') }}">
        <div class="form-group">
          <label class="form-label" for="username">Nom d'utilisateur</label>
          <input type="text" id="username" name="username" class="form-input" placeholder="Entrez votre nom d'utilisateur" required autofocus>
        </div>
        
        <div class="form-group" style="margin-top: 1rem;">
          <label class="form-label" for="password">Mot de passe</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="Entrez le mot de passe" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 1.5rem;">Se connecter</button>
      </form>
      
      <div style="margin-top: 1.5rem; text-align: center;">
        <p style="font-size: 0.875rem; color: var(--text-muted);">
          Pas encore de compte ? <a href="{{ url_for('register') }}" style="color: var(--primary); text-decoration: none; font-weight: 500;">Créer un compte</a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
